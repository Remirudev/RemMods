name: release

# Release pipeline (docs/PLAN.md §10, SPEC-P5 §7.5). A v* tag on main:
#   verify -> draft + build (no secrets) -> artifacts (installs and smoke-tests the exact bundles)
#   -> sign (only after artifacts passed) -> upload (assets, then writes latest.json)
#   -> latest-json (checks it: check-latest-json.py, signatures with minisign)
#   -> sums (SHA256SUMS, release assets byte-equal to the tested bundles) -> publish + aur-check
#   (parallel) -> aur-push (re-renders PKGBUILD/.SRCINFO and compares them with aur-check's).
# No job that builds holds a secret or a write token: `tauri build --no-sign` runs without either,
# and a separate `sign` job signs the finished files (SPEC-P5 A26).
# Environment `release` (required reviewer): sign, publish, aur-push.
# Secrets (environment `release`): TAURI_SIGNING_PRIVATE_KEY, TAURI_SIGNING_PRIVATE_KEY_PASSWORD,
# AUR_SSH_PRIVATE_KEY. Variables: AUR_KNOWN_HOSTS, AUR_COMMIT_EMAIL.
# Rules checked by scripts/check-workflows.py: SHA-pinned actions, no `${{ }}` in run scripts (values
# arrive through env), checkout without persisted credentials, no caches, `npm ci --ignore-scripts`,
# AppImage tools seeded before the build and checked after it.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

defaults:
  run:
    shell: bash

jobs:
  verify:
    name: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Release gate (versions, updater config, release-blocking Windows gaps)
        env:
          TAG: ${{ github.ref_name }}
        run: python3 -I scripts/release-check.py --tag "$TAG" --strict

      - name: The tagged commit is on main
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main

      - name: Version
        id: version
        env:
          TAG: ${{ github.ref_name }}
        run: echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

  draft:
    name: draft
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      release_id: ${{ steps.draft.outputs.release_id }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Refuses a published release for the tag; reuses one draft only if it holds nothing but
      # expected assets (strays are removed by hand); otherwise creates the draft.
      - name: Create or reuse the draft release
        id: draft
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          list_releases() {
            gh api --paginate "repos/$GH_REPO/releases?per_page=100" \
              --jq '.[] | [(.id | tostring), .tag_name, (.draft | tostring)] | @tsv' |
              awk -F'\t' -v tag="$TAG" '$2 == tag'
          }
          matches="$(list_releases)"
          if awk -F'\t' '$3 == "false"' <<< "$matches" | grep -q .; then
            echo "::error::$TAG already has a published release"
            exit 1
          fi
          drafts="$(awk -F'\t' '$3 == "true" { print $1 }' <<< "$matches")"
          if [[ $(grep -c . <<< "$drafts" || true) -gt 1 ]]; then
            echo "::error::$TAG has more than one draft release: $(tr '\n' ' ' <<< "$drafts")"
            exit 1
          fi
          if [[ -n $drafts ]]; then
            release_id="$drafts"
            gh api --paginate "repos/$GH_REPO/releases/$release_id/assets?per_page=100" \
              --jq '[.[] | {id, name}]' > "$RUNNER_TEMP/assets.json"
            python3 -I scripts/check-latest-json.py --exact-assets "$RUNNER_TEMP/assets.json" \
              --version "$VERSION" --subset
            echo "Reusing draft release $release_id"
          else
            sed "s/@VERSION@/$VERSION/g" packaging/release-notes.md > "$RUNNER_TEMP/release-notes.md"
            gh release create "$TAG" --draft --verify-tag --title "RemMods $VERSION" \
              --notes-file "$RUNNER_TEMP/release-notes.md"
            release_id="$(list_releases | awk -F'\t' '$3 == "true" { print $1 }')"
            if [[ ! $release_id =~ ^[0-9]+$ ]]; then
              echo "::error::could not find the new draft release for $TAG"
              exit 1
            fi
          fi
          echo "release_id=$release_id" >> "$GITHUB_OUTPUT"

  build:
    name: build (${{ matrix.name }})
    needs: verify
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux
            os: ubuntu-24.04
          - name: windows
            os: windows-2025
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node (.node-version)
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          package-manager-cache: false

      - name: Install Linux system packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev libwayland-dev build-essential pkg-config libssl-dev

      - name: Install Rust toolchain (rust-toolchain.toml)
        run: |
          rustup toolchain install
          rustc --version

      - name: npm ci
        run: npm ci --ignore-scripts

      # tauri-bundler downloads these without a hash check when they are missing.
      - name: Seed the AppImage tools (sha256-checked)
        if: runner.os == 'Linux'
        run: bash scripts/seed-appimage-tools.sh

      # The updater config comes only from tauri.release.conf.json; --no-sign: no key in this job.
      - name: Build the release bundles (unsigned)
        run: npm run tauri -- build --config src-tauri/tauri.release.conf.json --no-sign

      # Fails when the bundler skipped a seeded tool and downloaded its own (W11).
      - name: Check the AppImage tools cache
        if: runner.os == 'Linux'
        run: bash scripts/seed-appimage-tools.sh --verify-cache

      - name: glibc floor and package contents
        if: runner.os == 'Linux'
        run: |
          bash scripts/check-native.sh --glibc target/release/remmods
          python3 -I scripts/inspect-bundle.py --expect deb target/release/bundle/deb/*.deb
          python3 -I scripts/inspect-bundle.py --expect rpm target/release/bundle/rpm/*.rpm

      - name: Collect the bundles (Linux)
        if: runner.os == 'Linux'
        run: |
          mkdir -p dist-bundles
          cp target/release/bundle/{deb/*.deb,rpm/*.rpm,appimage/*.AppImage} dist-bundles/
          ls -l dist-bundles

      - name: Collect the bundles (Windows)
        if: runner.os == 'Windows'
        run: |
          mkdir -p dist-bundles
          cp target/release/bundle/nsis/*-setup.exe dist-bundles/
          ls -l dist-bundles

      - name: Upload the bundles
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bundles-${{ matrix.name }}
          path: dist-bundles/*
          if-no-files-found: error
          retention-days: 7

  artifacts:
    name: artifacts
    needs: build
    permissions:
      contents: read
    uses: ./.github/workflows/artifacts.yml
    with:
      prebuilt: true

  sign:
    name: sign
    needs: [verify, build, artifacts]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: release
    permissions:
      contents: read
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node (.node-version)
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          package-manager-cache: false

      # Only the Tauri CLI binary runs in this job; no install scripts.
      - name: npm ci
        run: npm ci --ignore-scripts

      - name: Download the Linux bundles
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: bundles-linux
          path: bundles

      - name: Download the Windows bundles
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: bundles-windows
          path: bundles

      - name: Sign the four bundles
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          for file in "RemMods_${VERSION}_amd64.AppImage" "RemMods_${VERSION}_amd64.deb" \
            "RemMods-${VERSION}-1.x86_64.rpm" "RemMods_${VERSION}_x64-setup.exe"; do
            node_modules/.bin/tauri signer sign --app-version "$VERSION" "bundles/$file"
          done

      - name: Collect the signatures
        run: |
          mkdir -p signatures
          mv bundles/*.sig signatures/
          ls -l signatures

      - name: Upload the signatures
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: signatures
          path: signatures/*.sig
          if-no-files-found: error
          retention-days: 7

  upload:
    name: upload
    needs: [verify, draft, sign]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download the bundles
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: bundles-*
          path: bundles
          merge-multiple: true

      - name: Download the signatures
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: signatures
          path: signatures

      - name: Upload the bundles, signatures and latest.json
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.verify.outputs.version }}
          RELEASE_ID: ${{ needs.draft.outputs.release_id }}
        run: |
          files=()
          for name in "RemMods_${VERSION}_amd64.AppImage" "RemMods_${VERSION}_amd64.deb" \
            "RemMods-${VERSION}-1.x86_64.rpm" "RemMods_${VERSION}_x64-setup.exe"; do
            files+=("bundles/$name" "signatures/$name.sig")
          done
          gh release upload "$TAG" "${files[@]}" --clobber
          gh api --paginate "repos/$GH_REPO/releases/$RELEASE_ID/assets?per_page=100" \
            --jq '[.[] | {id, name}]' > "$RUNNER_TEMP/assets.json"
          printf 'RemMods %s: https://github.com/%s/releases/tag/%s\n' "$VERSION" "$GH_REPO" "$TAG" \
            > "$RUNNER_TEMP/notes.txt"
          python3 -I scripts/make-latest-json.py --version "$VERSION" --assets "$RUNNER_TEMP/assets.json" \
            --sigs signatures --repo "$GH_REPO" --notes "$RUNNER_TEMP/notes.txt" --out "$RUNNER_TEMP/latest.json"
          gh release upload "$TAG" "$RUNNER_TEMP/latest.json" --clobber

  latest-json:
    name: latest-json
    needs: [verify, draft, upload]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # A draft and its assets are visible only with write access.
    permissions:
      contents: write
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install minisign
        run: |
          sudo apt-get update
          sudo apt-get install -y minisign

      - name: Check latest.json and verify the AppImage and installer signatures
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.verify.outputs.version }}
          RELEASE_ID: ${{ needs.draft.outputs.release_id }}
        run: |
          dir="$RUNNER_TEMP/release"
          mkdir -p "$dir"
          gh release download "$TAG" --dir "$dir" --pattern latest.json --pattern '*.AppImage' \
            --pattern '*-setup.exe'
          gh api --paginate "repos/$GH_REPO/releases/$RELEASE_ID/assets?per_page=100" \
            --jq '[.[] | {id, name}]' > "$RUNNER_TEMP/assets.json"
          python3 -I scripts/check-latest-json.py --latest "$dir/latest.json" \
            --config src-tauri/tauri.release.conf.json --version "$VERSION" \
            --assets "$RUNNER_TEMP/assets.json" --repo "$GH_REPO" --minisign "$dir"

  sums:
    name: sums
    needs: [verify, draft, latest-json]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    outputs:
      deb_sha256: ${{ steps.sums.outputs.deb_sha256 }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download the tested bundles
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: bundles-*
          path: built
          merge-multiple: true

      - name: Download the signatures
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: signatures
          path: built

      # Every release asset must be the exact file the artifacts jobs tested (or its signature).
      - name: Compare the release with the tested bundles and write SHA256SUMS
        id: sums
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.verify.outputs.version }}
          RELEASE_ID: ${{ needs.draft.outputs.release_id }}
        run: |
          gh api --paginate "repos/$GH_REPO/releases/$RELEASE_ID/assets?per_page=100" \
            --jq '[.[] | {id, name}]' > "$RUNNER_TEMP/assets.json"
          python3 -I scripts/check-latest-json.py --exact-assets "$RUNNER_TEMP/assets.json" --version "$VERSION"
          dir="$RUNNER_TEMP/release"
          mkdir -p "$dir"
          gh release download "$TAG" --dir "$dir" --pattern 'RemMods*'
          export LC_ALL=C
          shopt -s nullglob
          downloaded=("$dir"/*)
          if ((${#downloaded[@]} != 8)); then
            echo "::error::expected 8 bundle and signature assets, found ${#downloaded[@]}"
            exit 1
          fi
          for file in "${downloaded[@]}"; do
            name="$(basename "$file")"
            if ! cmp -s "$file" "built/$name"; then
              echo "::error::release asset $name differs from the tested workflow artifact"
              exit 1
            fi
          done
          (cd "$dir" && sha256sum -- *) > "$RUNNER_TEMP/SHA256SUMS"
          cat "$RUNNER_TEMP/SHA256SUMS"
          gh release upload "$TAG" "$RUNNER_TEMP/SHA256SUMS" --clobber
          deb_sha256="$(sha256sum "$dir/RemMods_${VERSION}_amd64.deb" | cut -d' ' -f1)"
          echo "deb_sha256=$deb_sha256" >> "$GITHUB_OUTPUT"

  publish:
    name: publish
    needs: [draft, sums, artifacts]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: release
    permissions:
      contents: write
    steps:
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: gh release edit "$TAG" --draft=false --latest

  # Runs in a throwaway Arch container, so it holds no secret and no environment.
  aur-check:
    name: aur-check
    needs: [verify, sums]
    runs-on: ubuntu-24.04
    container: archlinux:latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Install the build tools
        run: pacman -Syu --noconfirm --needed git python base-devel namcap

      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download the Linux bundles
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: bundles-linux
          path: bundles

      - name: Render PKGBUILD and .SRCINFO
        env:
          VERSION: ${{ needs.verify.outputs.version }}
          DEB_SHA256: ${{ needs.sums.outputs.deb_sha256 }}
        run: |
          python3 -I scripts/render-pkgbuild.py --deb "bundles/RemMods_${VERSION}_amd64.deb" \
            --version "$VERSION" --release --out aur
          grep -qxF "sha256sums=('$DEB_SHA256')" aur/PKGBUILD

      - name: .SRCINFO matches makepkg, namcap is clean
        run: |
          useradd -m builder
          chown -R builder: aur
          su builder -c 'cd aur && makepkg --printsrcinfo' > "$RUNNER_TEMP/SRCINFO"
          diff -u aur/.SRCINFO "$RUNNER_TEMP/SRCINFO"
          namcap aur/PKGBUILD | tee "$RUNNER_TEMP/namcap.txt"
          if grep -q ' E: ' "$RUNNER_TEMP/namcap.txt"; then exit 1; fi

      - name: Upload the AUR files
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: aur
          path: |
            aur/PKGBUILD
            aur/.SRCINFO
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  aur-push:
    name: aur-push
    needs: [verify, aur-check, sums, publish]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: release
    permissions:
      contents: read
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download the AUR files
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: aur
          path: aur

      # The PKGBUILD must name the published deb, and the published deb must be the tested one.
      - name: Check the package hash against the published deb
        env:
          VERSION: ${{ needs.verify.outputs.version }}
          DEB_SHA256: ${{ needs.sums.outputs.deb_sha256 }}
          REPO: ${{ github.repository }}
        run: |
          rendered="$(sed -n "s/^sha256sums=('\([0-9a-f]\{64\}\)')\$/\1/p" aur/PKGBUILD)"
          mkdir -p "$RUNNER_TEMP/deb"
          deb="$RUNNER_TEMP/deb/RemMods_${VERSION}_amd64.deb"
          curl -fsSL --proto '=https' -o "$deb" \
            "https://github.com/$REPO/releases/download/v$VERSION/RemMods_${VERSION}_amd64.deb"
          public="$(sha256sum "$deb" | cut -d' ' -f1)"
          if [[ -z $DEB_SHA256 || $rendered != "$DEB_SHA256" || $public != "$DEB_SHA256" ]]; then
            echo "::error::deb hash mismatch: PKGBUILD '$rendered', published '$public', tested '$DEB_SHA256'"
            exit 1
          fi
          printf '\tsha256sums = %s\n' "$DEB_SHA256" | grep -qxFf - aur/.SRCINFO

      # aur-check ran in a third-party container, so its files are only data here: they must equal
      # a fresh render from the checked-out template and the published deb, byte for byte.
      - name: Re-render PKGBUILD and .SRCINFO and compare
        env:
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          expected="$RUNNER_TEMP/aur-expected"
          python3 -I scripts/render-pkgbuild.py --deb "$RUNNER_TEMP/deb/RemMods_${VERSION}_amd64.deb" \
            --version "$VERSION" --release --out "$expected"
          for file in PKGBUILD .SRCINFO; do
            if ! cmp -- "aur/$file" "$expected/$file"; then
              echo "::error::aur/$file differs from a fresh render of packaging/aur/PKGBUILD.in"
              exit 1
            fi
          done

      - name: Push PKGBUILD and .SRCINFO to the AUR
        env:
          AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
          AUR_KNOWN_HOSTS: ${{ vars.AUR_KNOWN_HOSTS }}
          AUR_COMMIT_EMAIL: ${{ vars.AUR_COMMIT_EMAIL }}
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          umask 077
          if [[ -z $AUR_KNOWN_HOSTS ]]; then echo "::error::variable AUR_KNOWN_HOSTS is empty"; exit 1; fi
          if [[ -z $AUR_COMMIT_EMAIL ]]; then echo "::error::variable AUR_COMMIT_EMAIL is empty"; exit 1; fi
          key="$RUNNER_TEMP/aur_key"
          hosts="$RUNNER_TEMP/aur_known_hosts"
          printf '%s\n' "$AUR_SSH_PRIVATE_KEY" > "$key"
          printf '%s\n' "$AUR_KNOWN_HOSTS" > "$hosts"
          export GIT_SSH_COMMAND="ssh -i $key -o IdentitiesOnly=yes -o UserKnownHostsFile=$hosts -o StrictHostKeyChecking=yes"
          repo="$RUNNER_TEMP/aur-repo"
          git clone ssh://aur@aur.archlinux.org/remmods-bin.git "$repo"
          cp aur/PKGBUILD aur/.SRCINFO "$repo/"
          cd "$repo"
          git add PKGBUILD .SRCINFO
          if git diff --cached --quiet; then
            echo "AUR package already up to date"
            exit 0
          fi
          git -c user.name=remirudev -c user.email="$AUR_COMMIT_EMAIL" commit -m "Update to $VERSION"
          git push origin HEAD:master

      - name: Remove the key
        if: always()
        run: rm -f -- "$RUNNER_TEMP/aur_key"
