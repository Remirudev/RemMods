[package]
name = "remmods-core"
description = "RemMods core logic: synchronous, no Tauri"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[features]
default = ["rar-builtin"]
rar-builtin = ["dep:rars"]

[lib]
name = "remmods_core"
doctest = false

[dependencies]
remmods-pak.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
log.workspace = true
chrono.workspace = true
dirs.workspace = true
atomic-write-file.workspace = true
dunce.workspace = true
same-file.workspace = true
unicase.workspace = true
unicode-normalization.workspace = true
notify.workspace = true
uuid.workspace = true
zip.workspace = true
sevenz-rust2.workspace = true
rars = { workspace = true, optional = true }
encoding_rs.workspace = true
fs4.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
rustix.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys.workspace = true

[dev-dependencies]
tempfile.workspace = true
proptest.workspace = true
crc32fast.workspace = true
# Writers for crafted fixtures; tests only.
sevenz-rust2 = { workspace = true, features = ["compress"] }
rars = { workspace = true, features = ["write", "encryption"] }

[lints]
workspace = true
