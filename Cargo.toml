[workspace]
resolver = "3"
members = ["crates/remmods-core", "crates/remmods-ipc", "crates/remmods-pak", "crates/remmods-unpack", "src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
repository = "https://github.com/Remirudev/RemMods"

[workspace.dependencies]
remmods-core = { path = "crates/remmods-core" }
remmods-ipc = { path = "crates/remmods-ipc" }
remmods-pak = { path = "crates/remmods-pak" }
remmods-unpack = { path = "crates/remmods-unpack" }

tauri = { version = "=2.12.5" }
tauri-build = { version = "=2.7.4" }
tauri-plugin-single-instance = { version = "=2.5.5" }
tauri-plugin-log = { version = "=2.10.1" }
tauri-plugin-window-state = { version = "=2.5.0" }
tauri-plugin-opener = { version = "=2.7.2" }
tauri-plugin-dialog = { version = "=2.8.4", default-features = false, features = ["xdg-portal"] }
tauri-plugin-updater = { version = "=2.14.1", default-features = false, features = ["native-tls", "system-proxy"] }
tauri-specta = { version = "=2.0.0-rc.26", features = ["derive", "typescript"] }
specta = { version = "=2.0.0-rc.26", features = ["derive"] }
specta-typescript = { version = "=0.0.13" }

serde = { version = "=1.0.229", features = ["derive"] }
serde_json = { version = "=1.0.154" }
base64 = { version = "=0.23.1" }
thiserror = { version = "=2.0.21" }
log = { version = "=0.4.35" }
chrono = { version = "=0.4.45", default-features = false, features = ["clock", "std"] }
dirs = { version = "=7.0.0" }
atomic-write-file = { version = "=0.3.1" }
dunce = { version = "=1.0.5" }
same-file = { version = "=1.0.6" }
unicase = { version = "=2.10.0" }
unicode-normalization = { version = "=0.1.26" }
notify = { version = "=8.2.1", default-features = false }
uuid = { version = "=1.29.0", default-features = false, features = ["std", "v4"] }

zip = { version = "=9.3.0", default-features = false, features = ["deflate-flate2-zlib-rs", "deflate64", "bzip2", "lzma", "xz", "ppmd"] }
sevenz-rust2 = { version = "=0.24.2", default-features = false, features = ["bzip2", "ppmd", "deflate"] }
rars = { version = "=0.12.3", default-features = false }
encoding_rs = { version = "=0.8.44" }
fs4 = { version = "=1.1.0", default-features = false, features = ["sync"] }
crc32fast = { version = "=1.5.4" }
oozextract = { version = "=0.5.7", default-features = false }
texture2ddecoder = { version = "=0.1.2" }
png = { version = "=0.18.1", default-features = false }

rustix = { version = "=1.1.6", features = ["std", "process", "fs"] }
windows-sys = { version = "=0.61.2", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_Registry",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_Storage_FileSystem",
    "Win32_System_SystemInformation",
] }
# COM for the Recycle Bin mover (IFileOperation); both are already in the lock file through wry.
windows = { version = "=0.62.2", features = [
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_System_SystemServices",
    "Win32_UI_Shell",
] }
windows-core = { version = "=0.62.2" }

tempfile = { version = "=3.27.0" }
proptest = { version = "=1.12.0", default-features = false, features = ["std"] }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
# No unwrap()/expect() outside tests; a provably infallible one needs an allow and a reason.
unwrap_used = "warn"
expect_used = "warn"

# Archive decoders run at full speed in dev builds too (PLAN §2).
[profile.dev.package.zip]
opt-level = 3
[profile.dev.package.sevenz-rust2]
opt-level = 3
[profile.dev.package.rars]
opt-level = 3
[profile.dev.package.lzma-rust2]
opt-level = 3
[profile.dev.package.zlib-rs]
opt-level = 3
[profile.dev.package.libbz2-rs-sys]
opt-level = 3
[profile.dev.package.ppmd-rust]
opt-level = 3
[profile.dev.package.deflate64]
opt-level = 3
[profile.dev.package.oozextract]
opt-level = 3
[profile.dev.package.texture2ddecoder]
opt-level = 3
[profile.dev.package.png]
opt-level = 3

[profile.release]
lto = true
codegen-units = 1
strip = true
opt-level = 3
panic = "unwind"
