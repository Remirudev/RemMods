name: ci

# Merge gate (docs/PLAN.md §1, §9, §10): linux, windows, smoke (linux), smoke (windows) and policy.
# fs-matrix (P2) joins the required checks once it is green on a pull request; e2e (Playwright, P3b)
# is not a required check until the owner adds it.
# The package tests live in artifacts.yml: for now they run by hand and from release.yml, and are
# not a required check (SPEC-P5 A16).
# Actions are pinned by full commit SHA; Dependabot bumps the SHA and the version comment together.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "23 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

defaults:
  run:
    # Git Bash on Windows, so every step behaves the same on both runners.
    shell: bash

jobs:
  checks:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux
            os: ubuntu-24.04
          - name: windows
            os: windows-2025
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node (.node-version)
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install Linux system packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev libwayland-dev build-essential pkg-config libssl-dev

      - name: Install Rust toolchain (rust-toolchain.toml)
        run: |
          rustup toolchain install
          rustc --version
          cargo --version

      - name: Cache Rust build
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: npm ci
        run: npm ci

      # THIRD-PARTY-NOTICES-NPM is committed; it must match package-lock.json and node_modules.
      - name: npm notices are current
        if: runner.os == 'Linux'
        run: python3 -I scripts/npm-notices.py --check

      - name: Lint (Biome)
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Frontend tests
        run: npm test

      - name: Frontend build
        run: npm run build

      - name: cargo fmt
        run: cargo fmt --all --check

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: cargo test
        run: cargo test --workspace --locked

      # Zips crafted by Python (hostile names, flags, forged headers) through the archive reader.
      - name: Archive fixtures through core
        run: |
          if [[ "$RUNNER_OS" == Windows ]]; then PY=python; else PY=python3; fi
          "$PY" -I scripts/make-archive-fixtures.py "$RUNNER_TEMP/archive-fixtures"
          REMMODS_ARCHIVE_FIXTURES="$RUNNER_TEMP/archive-fixtures" cargo test -p remmods-core --locked --test archive_fixtures

      # `rar-builtin` is a default feature; without it a RAR is reported as RarDisabled.
      - name: Build and test without rar-builtin
        if: runner.os == 'Linux'
        run: |
          cargo check -p remmods-core --locked --no-default-features
          cargo test -p remmods-core --locked --no-default-features --test archive_backends

      # PLAN §4's 50 ms warm-scan gate needs an optimised build; the debug run above checks 250 ms.
      - name: Scan performance (release)
        if: runner.os == 'Linux'
        run: cargo test --release --locked -p remmods-core --test platform_linux_mods perf

      - name: IPC bindings are committed and current
        run: |
          npm run bindings
          if ! git ls-files --error-unmatch src/lib/ipc/bindings.ts > /dev/null 2>&1; then
            echo "::error file=src/lib/ipc/bindings.ts::bindings.ts is not committed: run 'npm run bindings' and commit it"
            exit 1
          fi
          if ! git diff --exit-code -- src/lib/ipc/bindings.ts; then
            echo "::error file=src/lib/ipc/bindings.ts::bindings.ts is stale: run 'npm run bindings' and commit the result"
            exit 1
          fi

      # The policy job builds nothing, so the build-script output part of the native guard runs here.
      - name: Native-code guard on build-script outputs
        if: runner.os == 'Linux'
        run: bash scripts/check-native.sh

  smoke:
    name: smoke (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux
            os: ubuntu-24.04
          - name: windows
            os: windows-2025
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node (.node-version)
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install Linux system packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev libwayland-dev build-essential pkg-config libssl-dev \
            xvfb dbus-x11

      - name: Install Rust toolchain (rust-toolchain.toml)
        run: |
          rustup toolchain install
          rustc --version

      - name: Cache Rust build
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: npm ci
        run: npm ci

      - name: Generate the smoke fixture
        run: |
          if [[ "$RUNNER_OS" == Windows ]]; then PY=python; else PY=python3; fi
          "$PY" -I scripts/make-fixtures.py smoke "$RUNNER_TEMP/remmods-fixture"

      # The Rust .utoc reader against the independent Python lister on the crafted fixture.
      - name: Cross-check the .utoc reader
        if: runner.os == 'Linux'
        run: bash scripts/utoc-compare.sh "$RUNNER_TEMP/remmods-fixture/steamapps/common/TEKKEN 8/Polaris/Content/Paks"

      - name: Build the app (debug, production assets and CSP)
        run: npm run tauri -- build --debug --no-bundle

      # PLAN §10 glibc floor (2.39); the release binary is checked again in release.yml/artifacts.yml.
      - name: glibc floor
        if: runner.os == 'Linux'
        run: bash scripts/check-native.sh --glibc target/debug/remmods

      # The smoke run keeps its data under the temp dir; pointing it at runner.temp lets the
      # failure upload below find the log folder.
      - name: Smoke test (Xvfb)
        if: runner.os == 'Linux'
        timeout-minutes: 5
        env:
          TMPDIR: ${{ runner.temp }}
        run: dbus-run-session -- xvfb-run -a -s "-screen 0 1280x1024x24" ./target/debug/remmods --smoke

      - name: Smoke test
        if: runner.os == 'Windows'
        timeout-minutes: 5
        env:
          TMP: ${{ runner.temp }}
          TEMP: ${{ runner.temp }}
        run: ./target/debug/remmods.exe --smoke

      # Scans the generated fixture (check scanFixture), toggles Standard:Alpha and Logic:Tool off and
      # on (check toggleRoundTrip) and installs install-smoke.zip (check installFixture).
      # smoke-paks-diff.sh proves the install added exactly Mods/SmokeInstall/ and everything else in
      # Paks ends as it began.
      - name: Smoke test with fixture (Xvfb)
        if: runner.os == 'Linux'
        timeout-minutes: 5
        env:
          TMPDIR: ${{ runner.temp }}
        run: |
          PAKS="$RUNNER_TEMP/remmods-fixture/steamapps/common/TEKKEN 8/Polaris/Content/Paks"
          bash scripts/paks-snapshot.sh "$PAKS" > "$RUNNER_TEMP/paks-before.tsv"
          dbus-run-session -- xvfb-run -a -s "-screen 0 1280x1024x24" ./target/debug/remmods --smoke --paks "$PAKS"
          bash scripts/paks-snapshot.sh "$PAKS" > "$RUNNER_TEMP/paks-after.tsv"
          bash scripts/smoke-paks-diff.sh "$RUNNER_TEMP/paks-before.tsv" "$RUNNER_TEMP/paks-after.tsv"

      - name: Smoke test with fixture
        if: runner.os == 'Windows'
        timeout-minutes: 5
        env:
          TMP: ${{ runner.temp }}
          TEMP: ${{ runner.temp }}
        run: |
          PAKS="$RUNNER_TEMP/remmods-fixture/steamapps/common/TEKKEN 8/Polaris/Content/Paks"
          bash scripts/paks-snapshot.sh "$PAKS" > "$RUNNER_TEMP/paks-before.tsv"
          ./target/debug/remmods.exe --smoke --paks "$PAKS"
          bash scripts/paks-snapshot.sh "$PAKS" > "$RUNNER_TEMP/paks-after.tsv"
          bash scripts/smoke-paks-diff.sh "$RUNNER_TEMP/paks-before.tsv" "$RUNNER_TEMP/paks-after.tsv"

      - name: Upload smoke logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: smoke-logs-${{ matrix.name }}
          path: |
            ${{ runner.temp }}/remmods-smoke-*/data/logs/
            ${{ runner.temp }}/paks-*.tsv
          if-no-files-found: ignore
          retention-days: 14

  # Real file systems (docs/PLAN.md §9, SPEC-P2 §9.2): the batch, rollback and recovery checks run on
  # tmpfs, ext4, btrfs, vfat and exfat mounts, plus read-only, root-owned, full-disk and tiny-inotify-
  # queue cases. P3 adds the Trash cases F1-F3 (SPEC-P3 §8.1): a topdir trash on every mount, the
  # nested btrfs subvolume, and a file system without RENAME_NOREPLACE (skipped, none exists). Needs
  # sudo for the mounts, so it builds only remmods-core (no Tauri, no Node).
  fs-matrix:
    name: fs-matrix
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install file system tools
        run: |
          sudo apt-get update
          sudo apt-get install -y btrfs-progs dosfstools exfatprogs

      - name: Install Rust toolchain (rust-toolchain.toml)
        run: |
          rustup toolchain install
          rustc --version

      - name: Cache Rust build
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Build the matrix test
        run: cargo test --locked -p remmods-core --test fs_matrix --no-run

      # stdout of the script is the REMMODS_FS_MATRIX* environment; notices go to stderr.
      - name: Mount the file systems
        run: sudo bash scripts/fs-matrix-mount.sh "$RUNNER_TEMP/fsm" >> "$GITHUB_ENV"

      - name: File system matrix
        run: cargo test --locked -p remmods-core --test fs_matrix -- --test-threads=1 --nocapture

  # Playwright flows (SPEC-P3B §8): Chromium against `vite --mode e2e`, whose stand-in backend
  # (e2e/mock) answers every command; no Rust build. Not a required check until the owner adds it.
  e2e:
    name: e2e
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node (.node-version)
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm

      - name: npm ci
        run: npm ci

      - name: Install Playwright's Chromium
        run: npx playwright install --with-deps chromium

      - name: Playwright flows
        run: npm run e2e

      - name: Upload the Playwright report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  policy:
    name: policy
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain (rust-toolchain.toml)
        run: |
          rustup toolchain install
          rustc --version

      - name: Install cargo-deny
        uses: taiki-e/install-action@c509219cf42fba86913069efd0ade2458c59337b # v2.90.1
        with:
          tool: cargo-deny@0.20.2
          fallback: none

      - name: cargo deny (advisories, bans, licences, sources)
        run: cargo deny --locked check

      - name: cfg placement guard
        run: bash scripts/check-cfg.sh

      - name: IPC command lists agree
        run: bash scripts/check-commands.sh

      - name: Native-code guard (dependency trees)
        run: bash scripts/check-native.sh

      - name: Install PyYAML (workflow checks)
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-yaml

      - name: Workflow security rules
        run: |
          python3 -I scripts/check-workflows.py --self-test
          python3 -I scripts/check-workflows.py

      - name: Release gate (CI mode) and release script self-tests
        run: |
          python3 -I scripts/release-check.py --self-test
          python3 -I scripts/release-check.py
          python3 -I scripts/check-latest-json.py --self-test
          python3 -I scripts/make-latest-json.py --self-test
          python3 -I scripts/render-pkgbuild.py --self-test
          python3 -I scripts/inspect-bundle.py --self-test
          bash -n scripts/seed-appimage-tools.sh
          bash -n scripts/notices.sh

      - name: Install cargo-about
        uses: taiki-e/install-action@c509219cf42fba86913069efd0ade2458c59337b # v2.90.1
        with:
          tool: cargo-about@0.9.3
          fallback: none

      - name: Rust notices are current
        run: |
          cargo fetch --locked
          bash scripts/notices.sh --check rust
