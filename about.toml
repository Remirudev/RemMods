# cargo-about 0.9.3 config for THIRD-PARTY-NOTICES (docs/PLAN.md §10). Regenerate with
# scripts/notices.sh, which runs:
#   cargo fetch --locked
#   cargo about generate --workspace --frozen --fail -c about.toml -o THIRD-PARTY-NOTICES about.hbs
# Same licence policy as deny.toml; earlier entries win when a crate offers a choice.

accepted = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "Zlib",
    "ISC",
    "CC0-1.0",
    "MIT-0",
    "Unlicense",
    "Unicode-3.0",
    "bzip2-1.0.6",
    "MPL-2.0",
]
targets = ["x86_64-unknown-linux-gnu", "x86_64-pc-windows-msvc"]
# Only code that ships in the binaries needs a notice.
ignore-build-dependencies = true
ignore-dev-dependencies = true
ignore-transitive-dependencies = false
# Built-in fixes for crates whose licence files confuse the scanner (chrono, the gtk-rs -sys crates).
workarounds = ["chrono", "gtk"]
private = { ignore = true }
