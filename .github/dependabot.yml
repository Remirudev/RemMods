version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      tauri:
        patterns:
          - "@tauri-apps/*"
      mantine:
        patterns:
          - "@mantine/*"
          - postcss-preset-mantine
      tanstack:
        patterns:
          - "@tanstack/*"
      tooling:
        patterns:
          - "@biomejs/*"
          - "@testing-library/*"
          - "@types/*"
          - "@vitejs/*"
          - jsdom
          - postcss
          - postcss-simple-vars
          - typescript
          - vite
          - vitest
    ignore:
      # TypeScript 7 ships no tsserver, which WebStorm needs (docs/PLAN.md §2).
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]

  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    groups:
      tauri:
        patterns:
          - tauri
          - tauri-build
          - tauri-plugin-*
      tooling:
        dependency-type: development
    ignore:
      # The specta chain is pinned exactly and bumped together by hand (docs/PLAN.md §2).
      - dependency-name: tauri-specta
      - dependency-name: specta
      - dependency-name: specta-typescript

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      tooling:
        patterns:
          - "*"
